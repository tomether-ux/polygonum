databases:
  - name: polygonum-database
    databaseName: polygonum
    user: polygonum_user
    plan: starter  # Piano a pagamento per persistenza garantita

services:
  # Servizio web principale Django
  - type: web
    name: polygonum
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      gunicorn --config gunicorn.conf.py scambio_sito.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polygonum-database
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: scambio_sito.settings
      # Usa la SECRET_KEY già presente in produzione. Non generarne una nuova:
      # web e cron devono firmare/verificare gli stessi link di moderazione.
      - key: SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,polygonum.io,www.polygonum.io"
      - key: RENDER_ENVIRONMENT
        value: "production"
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT_SECONDS
        value: "120"
      # Le email di moderazione sono accodate nel DB e gestite dal cron.
      - key: MODERATION_QUEUE_ENABLED
        value: "True"
    healthCheckPath: /health/
    domains:
      - polygonum.io

  # Un solo processo pianificato gestisce email persistenti e calcolo catene.
  # Il piano minimo e il timeout impediscono consumo compute incontrollato.
  - type: cron
    name: polygonum-background-tasks
    env: python
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_scheduled_tasks_guarded
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polygonum-database
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: scambio_sito.settings
      # Incolla esattamente la SECRET_KEY già usata dal servizio web.
      - key: SECRET_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: ADMIN_MODERATION_EMAIL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: noreply@polygonum.io
      - key: SITE_URL
        value: https://polygonum.io
      - key: BACKGROUND_EMAIL_LIMIT
        value: "10"
      - key: BACKGROUND_EMAIL_MAX_ATTEMPTS
        value: "8"
      # Elabora al massimo 500 scadenze per esecuzione, senza picchi di lavoro.
      - key: BACKGROUND_EXPIRATION_LIMIT
        value: "500"
      - key: BACKGROUND_CYCLE_INTERVAL_MINUTES
        value: "30"
      # 210s cooperativi, seguiti dal limite assoluto del processo a 240s.
      - key: BACKGROUND_TIME_BUDGET_SECONDS
        value: "210"
      - key: BACKGROUND_HARD_TIMEOUT_SECONDS
        value: "240"


# Configurazioni globali
previewsEnabled: false

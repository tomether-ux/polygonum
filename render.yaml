databases:
  - name: polygonum-database
    databaseName: polygonum
    user: polygonum_user
    plan: starter  # Piano a pagamento per persistenza garantita

services:
  # Servizio web principale Django
  - type: web
    name: polygonum
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      gunicorn --config gunicorn.conf.py scambio_sito.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polygonum-database
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: scambio_sito.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,polygonum.io,www.polygonum.io"
      - key: RENDER_ENVIRONMENT
        value: "production"
      - key: POLYGONUM_WEBHOOK_SECRET
        generateValue: true
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT_SECONDS
        value: "120"
    healthCheckPath: /
    domains:
      - polygonum.io


# Configurazioni globali
previewsEnabled: false
